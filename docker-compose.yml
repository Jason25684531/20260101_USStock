version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: usstock_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: usstock
      MYSQL_USER: trader
      MYSQL_PASSWORD: traderpassword
    volumes:
      - db_data:/var/lib/mysql
      - ./database/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - usstock_network

  strategy_engine:
    build:
      context: ./strategies
    container_name: usstock_strategy_engine
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=usstock
    volumes:
      - ./strategies/src:/app/src
    command: ["python", "src/main.py"]
    networks:
      - usstock_network

  web_dashboard:
    build:
      context: ./web
    container_name: usstock_web_dashboard
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=usstock
    volumes:
      - ./web:/app
    ports:
      - "5000:5000"
    networks:
      - usstock_network

networks:
  usstock_network:
    driver: bridge

volumes:
  db_data: