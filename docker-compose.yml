services:
  db:
    image: mysql:8.0
    container_name: usstock_db
    restart: always
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: usstock
      MYSQL_USER: trader
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - usstock_network

  strategy_engine:
    build:
      context: ./strategies
    container_name: usstock_strategy_engine
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_NAME=usstock
      - USE_SCHEDULER=true
      - TZ=America/New_York
      - TRADING_MODE=simulation
    volumes:
      - ./strategies/src:/app/src
      - ./data:/app/data
    ports:
      - "5001:5000"
    command: ["python", "src/main.py"]
    networks:
      - usstock_network

  web_dashboard:
    build:
      context: ./web
    container_name: usstock_web_dashboard
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_NAME=usstock
      - TZ=America/New_York
      - WEB_PORT=6688
    volumes:
      - ./web:/app
    ports:
      - "6688:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - usstock_network


networks:
  usstock_network:
    driver: bridge

volumes:
  db_data:
