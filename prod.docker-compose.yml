# Production Docker Compose Configuration
# 
# 生產環境配置：
# - 不暴露數據庫端口
# - 使用 gunicorn 運行 Web
# - 啟用調度器模式
# - 設置重啟策略
#
# 使用方式: docker-compose -f prod.docker-compose.yml up -d

services:
  db:
    image: mysql:8.0
    container_name: usstock_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: usstock
      MYSQL_USER: trader
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_root_password
      - db_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./database/init:/docker-entrypoint-initdb.d:ro
    # 生產環境不暴露數據庫端口
    # ports:
    #   - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$(cat /run/secrets/db_root_password)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - usstock_network

  strategy_engine:
    build:
      context: ./strategies
    container_name: usstock_strategy_engine
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_NAME=usstock
      - USE_SCHEDULER=true
      - TZ=America/New_York
    secrets:
      - db_root_password
      - alpaca_key
      - alpaca_secret
      - line_channel_token
      - line_user_id
    volumes:
      - ./strategies/src:/app/src
    command: ["python", "src/main.py"]
    networks:
      - usstock_network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  web_dashboard:
    build:
      context: ./web
    container_name: usstock_web_dashboard
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_NAME=usstock
      - TZ=America/New_York
    secrets:
      - db_root_password
      - web_password
      - line_channel_token
      - line_channel_secret
      - line_user_id
    volumes:
      - ./web:/app
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - usstock_network
    # 生產環境使用 gunicorn（已在 Dockerfile 中配置）
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--timeout", "120", "app:app"]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

secrets:
  db_root_password:
    file: ./.secrets/db_root_password.txt
  db_password:
    file: ./.secrets/db_password.txt
  alpaca_key:
    file: ./.secrets/alpaca_key.txt
  alpaca_secret:
    file: ./.secrets/alpaca_secret.txt
  web_password:
    file: ./.secrets/web_password.txt
  line_channel_token:
    file: ./.secrets/line_channel_token.txt
  line_channel_secret:
    file: ./.secrets/line_channel_secret.txt
  line_user_id:
    file: ./.secrets/line_user_id.txt

networks:
  usstock_network:
    driver: bridge

volumes:
  db_data:
