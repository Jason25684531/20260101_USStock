# Production Docker Compose Configuration
# 
# 生產環境配置：
# - 不暴露數據庫端口
# - 使用 gunicorn 運行 Web
# - 啟用調度器模式
# - 設置重啟策略
#
# 使用方式: docker-compose -f prod.docker-compose.yml up -d

services:
  db:
    image: mysql:8.0
    container_name: usstock_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: usstock
      MYSQL_USER: trader
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_root_password
      - db_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./database/init:/docker-entrypoint-initdb.d:ro
    # 生產環境不暴露數據庫端口
    # ports:
    #   - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$(cat /run/secrets/db_root_password)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - usstock_network

  strategy_engine:
    build:
      context: .
      dockerfile: strategies/Dockerfile
    container_name: usstock_strategy_engine
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=trader
      - DB_NAME=usstock
      - USE_SCHEDULER=true
      - STRATEGY_TYPE=screener
      - SCREENER_TOP_N=5
      - SCHEDULER_HOUR=16
      - SCHEDULER_MINUTE=15
      - MODEL_PATH=/app/data/model.pkl
      - TZ=America/New_York
    secrets:
      - db_password
      - alpaca_key
      - alpaca_secret
      - line_channel_token
      - line_user_id
    volumes:
      - ./data:/app/data
    command: ["python", "strategies/src/main.py"]
    networks:
      - usstock_network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  web_dashboard:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: usstock_web_dashboard
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=trader
      - DB_NAME=usstock
      - TZ=America/New_York
      - WEB_PORT=6688
      - MODEL_PATH=/app/data/model.pkl
    secrets:
      - db_password
      - web_password
      - line_channel_token
      - line_channel_secret
      - line_user_id
    volumes:
      - ./data:/app/data
    ports:
      - "6688:6688"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:6688/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - usstock_network
    # 生產環境使用 gunicorn（已在 Dockerfile 中配置）
    command: ["gunicorn", "--bind", "0.0.0.0:6688", "--workers", "2", "--timeout", "120", "app:app"]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

secrets:
  db_root_password:
    file: ./.secrets/db_root_password.txt
  db_password:
    file: ./.secrets/db_password.txt
  alpaca_key:
    file: ./.secrets/alpaca_key.txt
  alpaca_secret:
    file: ./.secrets/alpaca_secret.txt
  web_password:
    file: ./.secrets/web_password.txt
  line_channel_token:
    file: ./.secrets/line_channel_token.txt
  line_channel_secret:
    file: ./.secrets/line_channel_secret.txt
  line_user_id:
    file: ./.secrets/line_user_id.txt

networks:
  usstock_network:
    driver: bridge

volumes:
  db_data:
